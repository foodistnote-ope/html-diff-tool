<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Left Side Background (Light) -->
  <rect width="50" height="100" rx="20" fill="#f3f4f6" />
  <!-- Overlap to make smooth split -->
  <rect x="30" y="0" width="20" height="100" fill="#f3f4f6" />
  
  <!-- Right Side Background (Blue) -->
  <rect x="50" y="0" width="50" height="100" rx="20" fill="#2563eb" />
  <!-- Overlap to make smooth split -->
  <rect x="50" y="0" width="20" height="100" fill="#2563eb" />
  
  <!-- Left Bracket (Dark) -->
  <path d="M 35 30 L 15 50 L 35 70" fill="none" stroke="#1f2937" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Right Bracket (White) -->
  <path d="M 65 30 L 85 50 L 65 70" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Center Slash -->
  <path d="M 58 20 L 42 80" fill="none" stroke="#9ca3af" stroke-width="8" stroke-linecap="round" />
</svg>
